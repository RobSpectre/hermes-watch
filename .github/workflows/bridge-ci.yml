name: bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "plugin.yaml"
      - "__init__.py"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "plugin.yaml"
      - "__init__.py"
      - ".github/workflows/bridge-ci.yml"

jobs:
  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ./bridge
          pip install pytest pytest-asyncio

      - name: Test
        working-directory: bridge
        run: python -m pytest -q

      - name: Import the plugin entry point the way Hermes does
        # The repository root doubles as a Hermes plugin. If this import breaks,
        # `hermes plugins install` would install something that cannot load.
        run: python -c "import importlib.util,sys; spec=importlib.util.spec_from_file_location('hermes_watch_plugin','__init__.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); assert callable(m.register)"
