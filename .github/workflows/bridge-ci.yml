name: bridge

on:
  push:
    branches: [main]
    paths:
      - "bridge/**"
      - "plugin.yaml"
      - "__init__.py"
      - ".github/workflows/bridge-ci.yml"
  pull_request:
    paths:
      - "bridge/**"
      - "plugin.yaml"
      - "__init__.py"
      - ".github/workflows/bridge-ci.yml"

jobs:
  test:
    name: pytest (python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e "./bridge[dev]"

      - name: Test
        # The adapter subclasses a Hermes class, so tests/test_platform.py and
        # tests/test_watch_contract.py skip here (no Hermes installed) and run
        # for real on a machine that has one. `-rs` keeps that visible instead
        # of letting a green run imply coverage it does not have.
        working-directory: bridge
        run: python -m pytest -q -rs

      - name: Validate the plugin manifest
        # plugin.yaml is what `hermes plugins install` reads; a name that does
        # not match the package directory makes the plugin undiscoverable.
        run: |
          python - <<'PY'
          import re, pathlib
          text = pathlib.Path("plugin.yaml").read_text(encoding="utf-8")
          assert re.search(r"^name: hermes-watch$", text, re.M), "plugin name changed"
          assert "kind: platform" in text, "the watch is a platform plugin"
          print("plugin.yaml ok")
          PY

      - name: Import the plugin entry point the way Hermes does
        # The repository root doubles as a Hermes plugin. If this import breaks,
        # `hermes plugins install` would install something that cannot load.
        run: python -c "import importlib.util,sys; spec=importlib.util.spec_from_file_location('hermes_watch_plugin','__init__.py'); m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m); assert callable(m.register)"
