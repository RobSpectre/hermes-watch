name: watch

on:
  push:
    branches: [main]
    paths:
      - "watch/**"
      - ".github/workflows/watch-ci.yml"
  pull_request:
    paths:
      - "watch/**"
      - ".github/workflows/watch-ci.yml"
  workflow_dispatch:

jobs:
  build:
    name: assemble debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # The Gradle wrapper JAR is deliberately not committed (it is a binary);
      # setup-gradle installs the pinned distribution instead, so CI and a local
      # `gradle wrapper` both resolve to the same version.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Accept Android SDK licences
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Build
        working-directory: watch
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: hermes-watch-debug-apk
          path: watch/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
