[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-watch"
version = "0.1.0"
description = "Bridge Hermes Agent approvals, questions and live token/context stats to a Wear OS watch"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "aiohttp>=3.9",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
]

[project.scripts]
hermes-watch-bridge = "hermes_watch.cli:main"

[tool.setuptools]
packages = ["hermes_watch"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
